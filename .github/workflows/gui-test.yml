name: Flet GUI tests

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: gui-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Device integration (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[gui-test]'
      - name: Install Flet Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb $(flet --version --json | python -c "import json,sys; print(' '.join(json.load(sys.stdin)['linux_dependencies']))")
      - name: Test controls in the Flet device host
        run: xvfb-run -a flet test linux flet_integration --tests-dir tests --yes -v
