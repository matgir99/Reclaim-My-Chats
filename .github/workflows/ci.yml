name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and Python package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require develop as the source of main pull requests
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          PR_HEAD_BRANCH: ${{ github.head_ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        shell: bash
        run: |
          if [[ "$PR_HEAD_BRANCH" != "develop" || "$PR_HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::Pull requests to main must come from this repository's develop branch. Target develop first."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[gui-test]' build ruff pyright
      - run: python -m unittest discover -s tests -q
      - run: ruff check reclaim tests scripts flet_integration
      - run: pyright reclaim tests scripts flet_integration
      - run: python -m build
      - run: python -c "import flet, reclaim.gui; from reclaim.__main__ import main; assert main(['--version']) == 0"
