name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and Python package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[gui-test]' build ruff pyright
      - run: python -m unittest discover -s tests -q
      - run: ruff check reclaim tests scripts flet_integration
      - run: pyright reclaim tests scripts flet_integration
      - run: python -m build
      - run: python -c "import flet, reclaim.gui; from reclaim.__main__ import main; assert main(['--version']) == 0"
