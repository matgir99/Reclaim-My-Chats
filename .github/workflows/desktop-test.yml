name: Desktop packaging

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, main]
    paths:
      - pyproject.toml
      - uv.lock
      - .github/actions/install-locked/**
      - desktop/**
      - reclaim/desktop_smoke.py
      - scripts/pack_desktop.py
      - scripts/smoke_desktop.py
      - .github/workflows/desktop-test.yml
      - .github/workflows/release.yml

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop smoke test (${{ matrix.name }})
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python-arch: x64
            arch: x86_64
            name: ubuntu-22.04
          - os: windows-latest
            python-arch: x64
            arch: x86_64
            name: windows-latest
          - os: macos-latest
            python-arch: arm64
            arch: arm64
            name: macos-arm64
          - os: macos-latest
            python-arch: x64
            arch: x86_64
            name: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python-arch }}
      - uses: ./.github/actions/install-locked
        with:
          extra: gui-pack
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb $(flet --version --json | python -c "import json,sys; print(' '.join(json.load(sys.stdin)['linux_dependencies']))")
      - run: python scripts/pack_desktop.py --version 0.0.0 --arch "${{ matrix.arch }}"
      - name: Launch the extracted desktop application
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a python scripts/smoke_desktop.py dist/release/*
          else
            python scripts/smoke_desktop.py dist/release/*
          fi
