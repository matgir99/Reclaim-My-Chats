name: Desktop packaging

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, main]
    paths:
      - pyproject.toml
      - desktop/**
      - reclaim/desktop_smoke.py
      - scripts/pack_desktop.py
      - scripts/smoke_desktop.py
      - .github/workflows/desktop-test.yml
      - .github/workflows/release.yml

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop smoke test (${{ matrix.os }})
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[gui-test]'
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb $(flet --version --json | python -c "import json,sys; print(' '.join(json.load(sys.stdin)['linux_dependencies']))")
      - run: python scripts/pack_desktop.py --version 0.0.0
      - name: Launch the extracted desktop application
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a python scripts/smoke_desktop.py dist/release/*
          else
            python scripts/smoke_desktop.py dist/release/*
          fi
