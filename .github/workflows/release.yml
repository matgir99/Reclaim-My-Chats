name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify and build Python package
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Choose release version
        id: version
        run: |
          version=$(python scripts/next_version.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/install-locked
        with:
          dev: true
      - run: python -m unittest discover -s tests -q
      - name: Install isolated browser for protocol regression tests
        run: python -m playwright install --with-deps --only-shell chromium
      - name: Test provider requests with synthetic browser responses
        run: python -m unittest discover -s tests -p browser_protocols.py -v
      - run: ruff check reclaim tests scripts flet_integration
      - run: pyright reclaim tests scripts flet_integration
      - name: Build with the exact release version
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_RECLAIMMYCHATS: ${{ steps.version.outputs.version }}
        run: python -m build
      - name: Inspect wheel and source metadata
        run: python scripts/verify_python_artifacts.py --version "${{ steps.version.outputs.version }}" dist
      - name: Install the wheel and use the command line from it
        run: python scripts/smoke_wheel.py --version "${{ steps.version.outputs.version }}" dist
      - uses: actions/upload-artifact@v7
        with:
          name: python-packages
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  desktop:
    name: Build desktop (${{ matrix.name }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python-arch: x64
            arch: x86_64
            name: ubuntu-22.04
          - os: windows-latest
            python-arch: x64
            arch: x86_64
            name: windows-latest
          - os: macos-latest
            python-arch: arm64
            arch: arm64
            name: macos-arm64
          - os: macos-latest
            python-arch: x64
            arch: x86_64
            name: macos-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python-arch }}
      - name: Install desktop dependencies
        uses: ./.github/actions/install-locked
        with:
          extra: gui-pack
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_RECLAIMMYCHATS: ${{ needs.prepare.outputs.version }}
      - name: Pack desktop application
        run: python scripts/pack_desktop.py --version "${{ needs.prepare.outputs.version }}" --arch "${{ matrix.arch }}"
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb $(flet --version --json | python -c "import json,sys; print(' '.join(json.load(sys.stdin)['linux_dependencies']))")
      - name: Launch the extracted desktop application
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a python scripts/smoke_desktop.py dist/release/*
          else
            python scripts/smoke_desktop.py dist/release/*
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.name }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 3

  integration:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/gui-test.yml

  publish:
    name: Tag and publish verified artifacts
    needs: [prepare, desktop, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: '*'
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: python-packages
          path: release-python
      - name: Verify all packages before tagging
        run: |
          python scripts/verify_python_artifacts.py --version "$VERSION" release-assets
          python scripts/verify_desktop_artifacts.py --version "$VERSION" release-assets
          python scripts/write_checksums.py release-assets
      - name: Attest build provenance for release files
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'release-assets/*'
      - name: Check commit and create or reuse its tag
        run: |
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || { echo 'Main advanced; refusing to tag an outdated commit'; exit 1; }
          chosen=$(python scripts/next_version.py --require-ref origin/main)
          test "$chosen" = "$VERSION" || { echo "Version changed: $VERSION to $chosen"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            test "$(git rev-list -n 1 "v$VERSION")" = "$GITHUB_SHA" || { echo 'Tag points at another commit'; exit 1; }
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "v$VERSION" -m "Reclaim My Chats v$VERSION"
            git push origin "refs/tags/v$VERSION"
          fi
      - name: Publish or safely resume the draft
        run: python scripts/publish_release.py --repo "$GITHUB_REPOSITORY" --tag "v$VERSION" release-assets
      - name: Publish Python packages to PyPI
        if: vars.PYPI_PUBLISH == 'true'
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release-python
          skip-existing: true
