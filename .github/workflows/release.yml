name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify and build Python package
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Choose release version
        id: version
        run: |
          version=$(python scripts/next_version.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: python -m pip install -e '.[gui-test]' build ruff pyright
      - run: python -m unittest discover -s tests -q
      - run: ruff check reclaim tests scripts flet_integration
      - run: pyright reclaim tests scripts flet_integration
      - name: Build with the exact release version
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_RECLAIMMYCHATS: ${{ steps.version.outputs.version }}
        run: python -m build
      - name: Inspect wheel and source metadata
        run: python scripts/verify_python_artifacts.py --version "${{ steps.version.outputs.version }}" dist
      - name: Install the wheel and check the CLI version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          test "$("$RUNNER_TEMP/wheel-smoke/bin/python" -I -m reclaim --version)" = "reclaim $VERSION"
          RECLAIM_HOME="$RUNNER_TEMP/wheel-data" "$RUNNER_TEMP/wheel-smoke/bin/python" -I -m reclaim status
      - uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  desktop:
    name: Build desktop (${{ matrix.os }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install desktop dependencies
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_RECLAIMMYCHATS: ${{ needs.prepare.outputs.version }}
        run: python -m pip install -e '.[gui-test]'
      - name: Pack desktop application
        run: python scripts/pack_desktop.py --version "${{ needs.prepare.outputs.version }}"
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb $(flet --version --json | python -c "import json,sys; print(' '.join(json.load(sys.stdin)['linux_dependencies']))")
      - name: Launch the extracted desktop application
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a python scripts/smoke_desktop.py dist/release/*
          else
            python scripts/smoke_desktop.py dist/release/*
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 3

  integration:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/gui-test.yml

  publish:
    name: Tag and publish verified artifacts
    needs: [prepare, desktop, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: release-assets
          merge-multiple: true
      - name: Verify all packages before tagging
        run: |
          python scripts/verify_python_artifacts.py --version "$VERSION" release-assets
          python scripts/verify_desktop_artifacts.py --version "$VERSION" release-assets
          python scripts/write_checksums.py release-assets
      - name: Check commit and create or reuse its tag
        run: |
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || { echo 'Main advanced; refusing to tag an outdated commit'; exit 1; }
          chosen=$(python scripts/next_version.py --require-ref origin/main)
          test "$chosen" = "$VERSION" || { echo "Version changed: $VERSION to $chosen"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            test "$(git rev-list -n 1 "v$VERSION")" = "$GITHUB_SHA" || { echo 'Tag points at another commit'; exit 1; }
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "v$VERSION" -m "Reclaim My Chats v$VERSION"
            git push origin "refs/tags/v$VERSION"
          fi
      - name: Publish or safely resume the draft
        run: python scripts/publish_release.py --repo "$GITHUB_REPOSITORY" --tag "v$VERSION" release-assets
