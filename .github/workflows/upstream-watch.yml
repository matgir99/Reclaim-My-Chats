name: Upstream watch

# Weekly: report reference projects (docs/UPSTREAM_REVIEW.md) with commits
# after the revision last reviewed, and newer releases of the runtime
# dependencies that uv.lock installs, as one GitHub issue, which is closed
# when nothing is left. A schedule runs on the default branch, so scheduled
# runs check out develop, where reviews and dependency updates land before a
# release; a manual run uses the branch it is started on.
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    name: Check reference projects and dependency releases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/upstream_watch.py --issue
        env:
          GH_TOKEN: ${{ github.token }}
