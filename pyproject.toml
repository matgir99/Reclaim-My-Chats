[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "reclaimmychats"
dynamic = ["version"]
description = "Save AI chat history from six providers to a local Markdown database"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["playwright>=1.61"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]

[project.optional-dependencies]
gui = ["flet==1.0.5", "flet-desktop==1.0.5"]
gui-test = ["flet[test]==1.0.5", "flet-desktop==1.0.5", "flet-cli==1.0.5", "pyinstaller>=6"]

[project.scripts]
reclaim = "reclaim.__main__:main"

[project.gui-scripts]
reclaim-gui = "reclaim.gui:main"

[tool.setuptools.packages.find]
include = ["reclaim*"]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
# Errors and likely bugs (E, F, B), modern syntax (UP), function complexity
# (C90), and simpler forms of common code (SIM, C4, PIE, PERF, FURB...).
select = ["E4", "E7", "E9", "F", "B", "UP", "C90", "SIM", "C4", "PIE", "PERF", "ISC",
          "FURB", "PLC0207", "PLR5501", "PLW2901", "RUF005", "RUF012"]
# Nested `with` blocks in tests keep setup apart from the checked call.
ignore = ["SIM117"]

[tool.ruff.lint.mccabe]
# Split a function before it needs more than this many paths to follow.
max-complexity = 12

[tool.pyright]
pythonVersion = "3.12"
